name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - run: bun install --frozen-lockfile
      - name: Biome CI
        run: bunx biome ci .
      - name: Markdown and shell format
        run: bun run format:check
      - name: Spellcheck
        run: bun run spell
      - name: Architecture
        run: bun run architecture:check
      - name: CASA documentation
        run: bun run docs:check
      - name: Knip report
        run: bun run knip:report
      - name: Design (checks básicos)
        run: bun run design:check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Design tests (Storybook, a11y e cobertura)
        run: bun run design:test
      - name: Design visual regression
        run: bun run design:visual
      - name: Upload design reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-reports
          if-no-files-found: ignore
          path: |
            apps/storybook/.vitest-coverage/
            apps/storybook/visual/test-results/
            playwright-report/
            test-results/

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - run: pip install platformio==6.1.18
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Native firmware tests
        run: bun run firmware:test
      - name: ESP32 firmware build
        run: bun run firmware:build
      - name: Offline dashboard tests
        run: bun run firmware:test:web

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
