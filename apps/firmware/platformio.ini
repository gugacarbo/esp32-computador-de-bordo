[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32@6.10.0
board = esp32doit-devkit-v1
framework = arduino
board_build.filesystem = littlefs
; Bluetooth Classic + WiFi não cabem na partição de app padrão de 1,3 MB; a tabela própria
; tem dois slots de 1,69 MB para OTA e 512 KB de LittleFS (ADR-0009).
board_build.partitions = partitions_ota.csv
lib_deps =
  powerbroker2/ELMduino@3.4.1
  links2004/WebSockets@^2.6.1
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; Gravação por Wi-Fi (ArduinoOTA/espota): o host precisa estar na rede do SoftAP.
; A senha deve ser igual a ONIX_OTA_PASSWORD (include/config.h).
[env:ota]
extends = env:esp32doit-devkit-v1
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
  --port=3232
  --auth=onix-ota

; Variante de medição: firmware sem a task OBD/Bluetooth, para comparar Wi-Fi e HTTP sem o rádio
; dividido. Não usar no veículo.
[env:esp32-no-obd]
extends = env:esp32doit-devkit-v1
build_flags =
  ${env:esp32doit-devkit-v1.build_flags}
  -DONIX_DISABLE_OBD

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=c++17 -DUNITY_INCLUDE_DOUBLE
